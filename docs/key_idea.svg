<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="kiArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b5aa0"/>
    </marker>
    <marker id="kiArrowRev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#2b5aa0"/>
    </marker>
    <marker id="kiArrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/>
    </marker>
    <marker id="kiArrowGrayRev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#7a7a7a"/>
    </marker>
    <marker id="kiArrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <marker id="kiArrowBlackRev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#000000"/>
    </marker>
    <marker id="kiArrowSwap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e07b00"/>
    </marker>
    <marker id="kiArrowSwapRev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#e07b00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="27" font-weight="700" fill="#222">
    Software development for the instrument control (<tspan font-style="italic">viscope</tspan>)
  </text>

  <!-- Path backgrounds: virtual (left, gray) / real (right, blue) -->
  <rect x="12" y="58" width="430" height="594" rx="18" fill="#f0f0f2" stroke="#b8b8b8" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="458" y="58" width="430" height="594" rx="18" fill="#e5eef9" stroke="#9db5d6" stroke-width="2"/>

  <!-- Shared block (laptop + GUI) sits in a white notch spanning both paths -->
  <rect x="296" y="50" width="308" height="192" rx="14" fill="#ffffff"/>

  <!-- Path labels -->
  <text x="155" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#5a5a5a">
    <tspan x="155" dy="0">Rapid path for the</tspan>
    <tspan x="155" dy="25">development of the</tspan>
    <tspan x="155" dy="25">control software</tspan>
  </text>
  <text x="750" y="92" text-anchor="middle" font-size="20" font-weight="600" fill="#1f3f73">
    <tspan x="750" dy="0">Implementation of</tspan>
    <tspan x="750" dy="25">the control software</tspan>
  </text>

  <!-- Laptop icon -->
  <g transform="translate(450,100) scale(1.35)">
    <rect x="-42" y="-30" width="84" height="52" rx="4" fill="#ffffff" stroke="#333" stroke-width="2"/>
    <rect x="-35" y="-23" width="70" height="38" fill="#cfe3f7"/>
    <path d="M -52,22 L 52,22 L 44,32 L -44,32 Z" fill="#333"/>
  </g>

  <!-- GUI box -->
  <rect x="310" y="158" width="280" height="70" rx="10" fill="#ffffff" stroke="#2b5aa0" stroke-width="2.5"/>
  <text x="450" y="188" text-anchor="middle" font-size="20" fill="#222">Control software with</text>
  <text x="450" y="214" text-anchor="middle" font-size="20" fill="#222">graphical user interface</text>

  <!-- Double arrows GUI <-> instruments -->
  <line x1="370" y1="234" x2="250" y2="282" stroke="#2b5aa0" stroke-width="3.5" marker-end="url(#kiArrow)" marker-start="url(#kiArrowRev)"/>
  <line x1="530" y1="234" x2="650" y2="282" stroke="#2b5aa0" stroke-width="3.5" marker-end="url(#kiArrow)" marker-start="url(#kiArrowRev)"/>

  <!-- Virtual instruments (gray path) / Real instruments (black path) boxes -->
  <rect x="100" y="288" width="260" height="60" rx="10" fill="#ffffff" stroke="#7a7a7a" stroke-width="2.5"/>
  <text x="230" y="326" text-anchor="middle" font-size="22" font-weight="600" fill="#7a7a7a">Virtual instruments</text>

  <rect x="540" y="288" width="260" height="60" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="670" y="326" text-anchor="middle" font-size="22" font-weight="600" fill="#000000">Real instruments</text>

  <!-- Interchangeability arrow between the two paths -->
  <line x1="368" y1="318" x2="532" y2="318" stroke="#e07b00" stroke-width="7" marker-end="url(#kiArrowSwap)" marker-start="url(#kiArrowSwapRev)"/>

  <!-- Instrument icons: camera, lamp/laser, stage (gray, virtual) -->
  <g stroke="#7a7a7a" fill="none">
    <g transform="translate(135,418) scale(1.6)">
      <rect x="-20" y="-12" width="40" height="26" rx="4" stroke-width="2"/>
      <rect x="-9" y="-19" width="14" height="8" rx="2" stroke-width="2"/>
      <circle cx="0" cy="2" r="9" stroke-width="2"/>
      <circle cx="0" cy="2" r="3.5" fill="#7a7a7a"/>
    </g>
    <g transform="translate(230,418) scale(1.6)">
      <circle cx="0" cy="-6" r="13" stroke-width="2"/>
      <line x1="-6" y1="6" x2="-6" y2="14" stroke-width="2"/>
      <line x1="6" y1="6" x2="6" y2="14" stroke-width="2"/>
      <line x1="-6" y1="14" x2="6" y2="14" stroke-width="2"/>
    </g>
    <g transform="translate(325,418) scale(1.6)">
      <rect x="-16" y="-10" width="32" height="20" rx="2" stroke-width="2"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke-width="1.5" marker-end="url(#kiArrowGray)" marker-start="url(#kiArrowGrayRev)"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke-width="1.5" marker-end="url(#kiArrowGray)" marker-start="url(#kiArrowGrayRev)"/>
    </g>
  </g>

  <!-- Instrument icons: camera, lamp/laser, stage (black, real) -->
  <g stroke="#000000" fill="none">
    <g transform="translate(575,418) scale(1.6)">
      <rect x="-20" y="-12" width="40" height="26" rx="4" stroke-width="2"/>
      <rect x="-9" y="-19" width="14" height="8" rx="2" stroke-width="2"/>
      <circle cx="0" cy="2" r="9" stroke-width="2"/>
      <circle cx="0" cy="2" r="3.5" fill="#000000"/>
    </g>
    <g transform="translate(670,418) scale(1.6)">
      <circle cx="0" cy="-6" r="13" stroke-width="2"/>
      <line x1="-6" y1="6" x2="-6" y2="14" stroke-width="2"/>
      <line x1="6" y1="6" x2="6" y2="14" stroke-width="2"/>
      <line x1="-6" y1="14" x2="6" y2="14" stroke-width="2"/>
    </g>
    <g transform="translate(765,418) scale(1.6)">
      <rect x="-16" y="-10" width="32" height="20" rx="2" stroke-width="2"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke-width="1.5" marker-end="url(#kiArrowBlack)" marker-start="url(#kiArrowBlackRev)"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke-width="1.5" marker-end="url(#kiArrowBlack)" marker-start="url(#kiArrowBlackRev)"/>
    </g>
  </g>

  <!-- Bidirectional arrows instruments <-> probe row -->
  <line x1="230" y1="458" x2="230" y2="506" stroke="#7a7a7a" stroke-width="3.5" marker-end="url(#kiArrowGray)" marker-start="url(#kiArrowGrayRev)"/>
  <line x1="670" y1="458" x2="670" y2="506" stroke="#000000" stroke-width="3.5" marker-end="url(#kiArrowBlack)" marker-start="url(#kiArrowBlackRev)"/>

  <!-- Virtual probe response (gray) / Real probe measurement (black) boxes -->
  <rect x="80" y="510" width="300" height="60" rx="10" fill="#ffffff" stroke="#7a7a7a" stroke-width="2.5"/>
  <text x="230" y="548" text-anchor="middle" font-size="22" font-weight="600" fill="#7a7a7a">Virtual probe response</text>

  <rect x="520" y="510" width="300" height="60" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  <text x="670" y="548" text-anchor="middle" font-size="22" font-weight="600" fill="#000000">Real probe measurement</text>

  <!-- Calculator icon (virtual probe: response is only calculated, not measured) -->
  <g transform="translate(230,612) scale(1.4)" stroke="#7a7a7a" fill="none">
    <rect x="-14" y="-18" width="28" height="36" rx="3" stroke-width="2"/>
    <rect x="-10" y="-14" width="20" height="9" rx="1" stroke-width="1.5"/>
    <circle cx="-7" cy="0" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="0" cy="0" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="7" cy="0" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="-7" cy="7" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="0" cy="7" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="7" cy="7" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="-7" cy="14" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="0" cy="14" r="1.8" fill="#7a7a7a" stroke="none"/>
    <circle cx="7" cy="14" r="1.8" fill="#7a7a7a" stroke="none"/>
  </g>

  <!-- Syringe icon (real probe: an actual physical measurement) -->
  <g transform="translate(670,612) scale(2.2)" stroke="#000000" fill="none">
    <rect x="-23" y="-4" width="4" height="8" fill="#000000" stroke="none"/>
    <line x1="-19" y1="0" x2="-14" y2="0" stroke-width="3"/>
    <line x1="-14" y1="-5" x2="-14" y2="5" stroke-width="2"/>
    <rect x="-14" y="-5" width="24" height="10" rx="2" stroke-width="2"/>
    <line x1="-6" y1="-5" x2="-6" y2="5" stroke-width="1"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke-width="1"/>
    <line x1="10" y1="0" x2="22" y2="0" stroke-width="2"/>
  </g>

</svg>
